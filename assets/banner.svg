<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Autonomous Mobile Robots">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16244a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#aab6d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6b8cff" stroke-opacity=".12"/>
    </pattern>
    <g id="bot">
      <ellipse cx="0" cy="62" rx="52" ry="8" fill="#000" opacity=".35"/>
      <rect x="-48" y="18" width="96" height="40" rx="14" fill="url(#body)"/>
      <rect x="-34" y="-20" width="68" height="44" rx="12" fill="url(#body)"/>
      <rect x="-26" y="-12" width="52" height="26" rx="8" fill="#0b1020"/>
      <circle cx="-11" cy="1" r="5.5" fill="#38bdf8"/><circle cx="11" cy="1" r="5.5" fill="#38bdf8"/>
      <line x1="0" y1="-20" x2="0" y2="-36" stroke="#aab6d6" stroke-width="3"/>
      <circle cx="0" cy="-39" r="4.5" fill="#f472b6"/>
      <circle cx="-30" cy="58" r="11" fill="#1e293b" stroke="#aab6d6" stroke-width="3"/>
      <circle cx="30" cy="58" r="11" fill="#1e293b" stroke="#aab6d6" stroke-width="3"/>
      <rect x="-14" y="30" width="28" height="6" rx="3" fill="#38bdf8" opacity=".8"/>
    </g>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Planned path (PRM) -->
  <g fill="none" stroke="#38bdf8" stroke-opacity=".28" stroke-width="1.5">
    <path d="M610 330 L690 280 L760 300 L840 240 L930 270 L1010 200 L1100 230"/>
    <path d="M690 280 L720 220 L800 190 L840 240"/>
    <path d="M760 300 L800 350 L880 330 L930 270"/>
  </g>
  <g fill="#38bdf8" fill-opacity=".5">
    <circle cx="610" cy="330" r="4"/><circle cx="690" cy="280" r="4"/><circle cx="760" cy="300" r="4"/>
    <circle cx="840" cy="240" r="4"/><circle cx="930" cy="270" r="4"/><circle cx="1010" cy="200" r="4"/>
    <circle cx="720" cy="220" r="4"/><circle cx="800" cy="190" r="4"/><circle cx="800" cy="350" r="4"/><circle cx="880" cy="330" r="4"/>
  </g>
  <path d="M610 330 L690 280 L760 300 L840 240 L930 270 L1010 200 L1100 230" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <circle cx="1100" cy="230" r="9" fill="none" stroke="#f472b6" stroke-width="3"/><circle cx="1100" cy="230" r="3" fill="#f472b6"/>

  <!-- Particle cloud -->
  <g fill="#a3e635" fill-opacity=".7">
    <circle cx="640" cy="316" r="2.5"/><circle cx="648" cy="322" r="2.5"/><circle cx="632" cy="324" r="2.5"/>
    <circle cx="655" cy="310" r="2.5"/><circle cx="643" cy="332" r="2.5"/><circle cx="660" cy="324" r="2.5"/>
    <circle cx="626" cy="312" r="2.5"/><circle cx="651" cy="336" r="2.5"/>
  </g>

  <!-- LiDAR -->
  <circle cx="330" cy="215" r="170" fill="url(#glow)"/>
  <g stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.2">
    <line x1="330" y1="215" x2="500" y2="110"/><line x1="330" y1="215" x2="520" y2="160"/>
    <line x1="330" y1="215" x2="530" y2="215"/><line x1="330" y1="215" x2="520" y2="270"/>
    <line x1="330" y1="215" x2="500" y2="320"/>
  </g>
  <g fill="#38bdf8"><circle cx="500" cy="110" r="3"/><circle cx="520" cy="160" r="3"/><circle cx="530" cy="215" r="3"/><circle cx="520" cy="270" r="3"/><circle cx="500" cy="320" r="3"/></g>

  <use href="#bot" transform="translate(330 195) scale(1.55)"/>
  <use href="#bot" transform="translate(150 330) scale(.7)" opacity=".75"/>

  <!-- Text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#38bdf8">ROS 2 HUMBLE · COPPELIASIM · PYTHON</text>
    <text x="598" y="140" font-size="46" font-weight="800" fill="#ffffff">Autonomous</text>
    <text x="598" y="190" font-size="46" font-weight="800" fill="#ffffff">Mobile Robots</text>
  </g>
</svg>
